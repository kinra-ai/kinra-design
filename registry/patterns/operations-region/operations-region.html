<section class="kin-pattern-operations-region" aria-labelledby="jobs-heading">
	<header class="kin-pattern-operations-region__header">
		<div>
			<div class="kin-cluster" data-space="compact">
				<h2 id="jobs-heading">Recent jobs</h2>
				<span class="kin-status" data-state="success">Healthy</span>
			</div>
			<p>Inspect the latest bounded work and its recorded outcome.</p>
		</div>
		<a class="kin-button kin-button--quiet" href="#">View all jobs</a>
	</header>
	<div class="kin-table-wrap">
		<table class="kin-table">
			<caption>
				Two most recent jobs
			</caption>
			<thead>
				<tr>
					<th scope="col">Job</th>
					<th scope="col">State</th>
					<th scope="col">Duration</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>Index repository</td>
					<td><span class="kin-badge" data-tone="success">Complete</span></td>
					<td>12.4 s</td>
				</tr>
				<tr>
					<td>Verify release</td>
					<td><span class="kin-badge" data-tone="reason">Review</span></td>
					<td>48.1 s</td>
				</tr>
			</tbody>
		</table>
	</div>
</section>
