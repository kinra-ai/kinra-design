<section
	class="kin-card kin-pattern-corner-action"
	aria-labelledby="review-title"
>
	<div class="kin-card__body">
		<h2 class="kin-heading" id="review-title">Save these preferences?</h2>
		<p class="kin-body" data-size="sm">
			The next view uses the choices you made.
		</p>
	</div>
	<footer class="kin-card__footer kin-pattern-corner-action__footer">
		<button type="button" class="kin-button kin-button--ghost">Cancel</button>
		<button
			type="button"
			class="kin-button kin-button--primary kin-pattern-corner-action__key"
		>
			Save preferences
		</button>
	</footer>
</section>
