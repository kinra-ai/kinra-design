<!-- Supply the accessible name, disabled state and face from the same action. -->
<button
	type="button"
	class="kin-pattern-corner-key"
	data-face="rest"
	aria-label="Send message"
	disabled
>
	<span class="kin-pattern-corner-key__base" aria-hidden="true"></span>
	<span class="kin-pattern-corner-key__edge" aria-hidden="true"></span>
	<span class="kin-pattern-corner-key__layer" aria-hidden="true"
		><span class="kin-pattern-corner-key__glyph"
			><i class="kin-pattern-corner-key__stroke"><b></b></i>
			<i class="kin-pattern-corner-key__stroke"><b></b></i>
			<i class="kin-pattern-corner-key__stroke"><b></b></i>
			<i class="kin-pattern-corner-key__stroke"><b></b></i
		></span>
		<svg
			class="kin-pattern-corner-key__trace"
			viewBox="0 0 48 48"
			aria-hidden="true"
		>
			<path pathLength="100" d="M1 1H47V41A6 6 0 0 1 41 47H1Z"></path></svg
	></span>
	<span class="kin-pattern-corner-key__fill" aria-hidden="true"
		><span class="kin-pattern-corner-key__flash"></span
		><span
			class="kin-pattern-corner-key__layer kin-pattern-corner-key__layer--on"
			><span class="kin-pattern-corner-key__glyph"
				><i class="kin-pattern-corner-key__stroke"><b></b></i>
				<i class="kin-pattern-corner-key__stroke"><b></b></i>
				<i class="kin-pattern-corner-key__stroke"><b></b></i>
				<i class="kin-pattern-corner-key__stroke"><b></b></i
			></span>
			<svg
				class="kin-pattern-corner-key__trace"
				viewBox="0 0 48 48"
				aria-hidden="true"
			>
				<path
					pathLength="100"
					d="M1 1H47V41A6 6 0 0 1 41 47H1Z"
				></path></svg></span
	></span>
	<span class="kin-pattern-corner-key__bend" aria-hidden="true"></span>
</button>
